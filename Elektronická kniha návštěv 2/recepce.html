<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Návštěvní kniha – Recepce</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0f172a;--ink2:#475569;--ink3:#94a3b8;
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;
  --border:#e2e8f0;--border2:#cbd5e1;
  --green:#059669;--green-bg:#ecfdf5;--green-border:#a7f3d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --amber:#d97706;--amber-bg:#fffbeb;--amber-border:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-border:#bfdbfe;
  --slate:#334155;
  --r:8px;--r2:12px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px}
.topbar{background:var(--slate);color:#fff;padding:0 1.5rem;height:56px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.topbar-logo{width:28px;height:28px;background:#fff2;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar h1{font-size:1rem;font-weight:600;letter-spacing:.2px}
.topbar .clock{margin-left:auto;font-size:.85rem;font-variant-numeric:tabular-nums;opacity:.85;font-family:ui-monospace,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:1.25rem 1.25rem 2rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:1rem 1.25rem}
.stat-val{font-size:2rem;font-weight:700;line-height:1;margin-bottom:.25rem;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:.78rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
.stat-green .stat-val{color:var(--green)}
.stat-blue .stat-val{color:var(--blue)}
.main-grid{display:grid;grid-template-columns:340px 1fr;gap:1.25rem;align-items:start}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-head{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:8px;border-radius:var(--r2) var(--r2) 0 0}
.card-head h2{font-size:.9rem;font-weight:600;color:var(--ink)}
.card-body{padding:1.25rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;font-size:.875rem;font-weight:500;border-radius:var(--r);border:none;cursor:pointer;transition:all .13s;font-family:inherit;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1e40af}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#047857}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#b91c1c}
.btn-ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-full{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-group{margin-bottom:.875rem}
.form-group:last-child{margin-bottom:0}
label.lbl{display:block;font-size:.75rem;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input[type=text]{width:100%;padding:9px 11px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:.9rem;font-family:inherit;color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--blue)}
input[type=text]::placeholder{color:var(--ink3)}
.input-big{font-size:1.1rem;padding:11px 13px;font-weight:500}
.upload-wrap{display:flex;flex-direction:column;gap:.5rem;padding:.25rem 0;margin-bottom:.5rem}
.webcam-container{width:100%;background:#000;border-radius:var(--r);overflow:hidden;position:relative;display:none;aspect-ratio:4/3}
.webcam-container video{width:100%;height:100%;object-fit:cover}
.or-divider{display:flex;align-items:center;gap:.75rem;color:var(--ink3);font-size:.8rem;margin:.5rem 0}
.or-divider::before,.or-divider::after{content:'';flex:1;border-top:1px solid var(--border)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:9px 12px;font-size:.73rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);border-bottom:1.5px solid var(--border);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.td-name{font-weight:600;font-size:.9rem}
.td-time{font-family:ui-monospace,monospace;font-size:.82rem;color:var(--ink2);white-space:nowrap}
.td-time .date{font-size:.72rem;color:var(--ink3)}
.td-org{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.73rem;font-weight:600;white-space:nowrap}
.badge-active{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge-done{background:var(--surface2);color:var(--ink3);border:1px solid var(--border)}
.tabs{display:flex;gap:6px;margin-bottom:1rem}
.tab{padding:6px 14px;border-radius:20px;font-size:.8rem;font-weight:500;border:1px solid var(--border);cursor:pointer;background:var(--surface);color:var(--ink2);transition:all .13s}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab:hover:not(.active){background:var(--surface2)}
.alert{padding:9px 13px;border-radius:var(--r);font-size:.85rem;display:flex;align-items:flex-start;gap:8px;margin-bottom:.875rem;line-height:1.4}
.alert-success{background:var(--green-bg);color:#065f46;border:1px solid var(--green-border)}
.alert-error{background:var(--red-bg);color:#991b1b;border:1px solid var(--red-border)}
.alert-info{background:var(--blue-bg);color:#1e40af;border:1px solid var(--blue-border)}
.alert-amber{background:var(--amber-bg);color:#92400e;border:1px solid var(--amber-border)}
.hidden{display:none!important}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--ink3);font-size:.9rem}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--surface);border-radius:var(--r2);padding:1.5rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-size:1rem;font-weight:600;margin-bottom:1rem}
.modal-footer{display:flex;gap:.75rem;margin-top:1.25rem;justify-content:flex-end}
@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .topbar h1{font-size:.875rem}
  .wrap{padding:1rem .875rem 2rem}
}
</style>
</head>
<body>
 
<div class="topbar">
  <div class="topbar-logo">
    <svg width="16" height="16" fill="none" stroke="white" stroke-width="2.2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
  </div>
  <h1>Návštěvní kniha</h1>
  <span class="clock" id="clk">--:--:--  &nbsp; --.--.----</span>
</div>
 
<div class="wrap">
  <div class="stats">
    <div class="stat stat-green">
      <div class="stat-val" id="s-aktivni">—</div>
      <div class="stat-lbl">Aktuálně přítomní</div>
    </div>
    <div class="stat stat-blue">
      <div class="stat-val" id="s-dnes">—</div>
      <div class="stat-lbl">Dnes celkem</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="s-celkem">—</div>
      <div class="stat-lbl">Celkem záznamů</div>
    </div>
  </div>
 
  <div class="main-grid">
    <div>
      <div class="card">
        <div class="card-head">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          <h2>Nový návštěvník</h2>
        </div>
        <div class="card-body">
 
          <div class="upload-wrap">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(this)">
            <button class="btn btn-primary btn-full" onclick="document.getElementById('fileInput').click()">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Nahrát doklad ze souboru
            </button>
            <button class="btn btn-ghost btn-full" id="btnWebcamToggle" onclick="toggleWebcam()">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              Použít webkameru
            </button>
            <div class="webcam-container" id="webcamContainer">
              <video id="video" autoplay playsinline></video>
              <button class="btn btn-red btn-sm" onclick="takeSnapshot()" style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);opacity:.9;">
                📸 Vyfotit doklad
              </button>
            </div>
            <canvas id="canvas" style="display:none;"></canvas>
          </div>
 
          <div class="or-divider">nebo zadejte ručně</div>
 
          <div id="fAlert" class="alert hidden"></div>
 
          <div class="form-row">
            <div class="form-group">
              <label class="lbl" for="fJmeno">Jméno</label>
              <input type="text" id="fJmeno" class="input-big" placeholder="Jan"/>
            </div>
            <div class="form-group">
              <label class="lbl" for="fPrijmeni">Příjmení</label>
              <input type="text" id="fPrijmeni" class="input-big" placeholder="Novák"/>
            </div>
          </div>
          <div class="form-group">
            <label class="lbl" for="fOrg">Organizace</label>
            <input type="text" id="fOrg" placeholder="Firma s.r.o. (nepovinné)"/>
          </div>
          <div class="form-group">
            <label class="lbl" for="fSpz">SPZ vozidla</label>
            <input type="text" id="fSpz" placeholder="1AB 2345 (nepovinné)" style="text-transform:uppercase"/>
          </div>
          <button class="btn btn-green btn-full" id="btnZapis" onclick="zapsat()">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Zapsat příchod
          </button>
        </div>
      </div>
    </div>
 
    <div>
      <div class="card">
        <div class="card-head">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <h2>Přehled návštěv</h2>
          <button class="btn btn-ghost btn-sm" onclick="nactiData()" style="margin-left:auto;font-size:.75rem">
            <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.31-5.26"/></svg>
            Obnovit
          </button>
        </div>
        <div class="card-body" style="padding:.875rem 1.25rem">
          <div class="tabs">
            <div class="tab active" onclick="setFilter('aktivni',this)">Přítomní</div>
            <div class="tab" onclick="setFilter('dnes',this)">Dnes</div>
            <div class="tab" onclick="setFilter('vse',this)">Vše</div>
          </div>
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>Jméno a příjmení</th>
                  <th>Organizace</th>
                  <th>SPZ</th>
                  <th>Příchod</th>
                  <th>Odchod</th>
                  <th>Stav</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tbl">
                <tr><td colspan="7" class="empty">Načítám…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
 
<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <h3 id="modalTitle">Upravit záznam</h3>
    <div class="form-group">
      <label class="lbl">Jméno</label>
      <input type="text" id="mJmeno" readonly style="background:var(--surface2);color:var(--ink2)"/>
    </div>
    <div class="form-group">
      <label class="lbl">Organizace</label>
      <input type="text" id="mOrg" placeholder="—"/>
    </div>
    <div class="form-group">
      <label class="lbl">SPZ vozidla</label>
      <input type="text" id="mSpz" placeholder="—" style="text-transform:uppercase"/>
    </div>
    <div id="mAlertDiv" class="alert hidden"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Zrušit</button>
      <button class="btn btn-primary" onclick="saveModal()">Uložit</button>
      <button class="btn btn-red" id="mOdchodBtn" onclick="zapisOdchod()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Zapsat odchod
      </button>
    </div>
  </div>
</div>
 
<script>
const API = 'http://localhost:5050/api';
let filter = 'aktivni';
let modalId = null;
let data = [];
let videoStream = null;
 
// ── Hodiny ────────────────────────────────────────────────────────────────────
function tick() {
  const n = new Date();
  document.getElementById('clk').textContent =
    n.toLocaleTimeString('cs-CZ') + '\u2002\u2002' + n.toLocaleDateString('cs-CZ');
}
setInterval(tick, 1000); tick();
 
// ── Webkamera ─────────────────────────────────────────────────────────────────
function handleFileSelect(input) {
  if (input.files && input.files[0]) {
    zpracujDoklad(input.files[0]);
  }
}
 
async function toggleWebcam() {
  const container = document.getElementById('webcamContainer');
  const video     = document.getElementById('video');
  const btn       = document.getElementById('btnWebcamToggle');
  if (container.style.display === 'block') {
    stopWebcam();
  } else {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = videoStream;
      container.style.display = 'block';
      btn.textContent = 'Vypnout webkameru';
    } catch (err) {
      showAlert('fAlert', 'error', 'Nepodařilo se spustit webkameru: ' + err.message);
    }
  }
}
 
function stopWebcam() {
  const container = document.getElementById('webcamContainer');
  const btn       = document.getElementById('btnWebcamToggle');
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  container.style.display = 'none';
  btn.innerHTML = `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Použít webkameru`;
}
 
function takeSnapshot() {
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  if (!video.videoWidth) { showAlert('fAlert','error','Kamera ještě není připravena.'); return; }
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => { zpracujDoklad(blob); stopWebcam(); }, 'image/jpeg', 0.95);
}
 
// ── OCR ───────────────────────────────────────────────────────────────────────
async function zpracujDoklad(fileOrBlob) {
  showAlert('fAlert', 'info', '⏳ Zpracovávám doklad…');
 
  try {
    // Převod na base64 bez hlavičky
    const base64Data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(fileOrBlob);
      reader.onload  = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
    });
 
    const res = await fetch(API + '/ocr', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ image: base64Data })
    });
 
    let d = {};
    try { d = await res.json(); } catch(e) {}
 
    if (!res.ok) {
      showAlert('fAlert', 'error', '⚠ Chyba serveru ' + res.status + ': ' + (d.error || 'neznámá chyba'));
      return;
    }
 
    if (d.error) {
      showAlert('fAlert', 'error', '⚠ OCR chyba: ' + d.error);
      return;
    }
 
    // Vyplň pole
    document.getElementById('fJmeno').value    = d.jmeno    || '';
    document.getElementById('fPrijmeni').value = d.prijmeni || '';
 
    if (d.jmeno && d.prijmeni) {
      showAlert('fAlert', 'success', '✓ Rozpoznáno: ' + d.jmeno + ' ' + d.prijmeni + ' — zkontrolujte a zapište příchod.');
    } else {
      // Ukáže co OCR přečetl, aby bylo jasné proč jméno nenašel
      const nahlad = (d.text || '').trim().substring(0, 200).replace(/\n/g, ' ') || '(prázdný text)';
      showAlert('fAlert', 'amber', '⚠ Jméno se nepodařilo rozpoznat. OCR přečetl: „' + nahlad + '" — doplňte ručně.');
    }
 
  } catch (e) {
    showAlert('fAlert', 'error', '⚠ Nelze se připojit k serveru: ' + e.message);
  }
}
 
// ── Filtr ─────────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  nactiData();
}
 
// ── Načtení dat ───────────────────────────────────────────────────────────────
async function nactiData() {
  try {
    const [rData, rStats] = await Promise.all([
      fetch(API + '/navstevnici?filter=' + filter).then(r => r.json()),
      fetch(API + '/stats').then(r => r.json())
    ]);
    data = rData;
    document.getElementById('s-aktivni').textContent = rStats.aktivni ?? '—';
    document.getElementById('s-dnes').textContent    = rStats.dnes    ?? '—';
    document.getElementById('s-celkem').textContent  = rStats.celkem  ?? '—';
    renderTbl();
  } catch (e) {
    document.getElementById('tbl').innerHTML =
      `<tr><td colspan="7" class="empty" style="color:var(--red)">⚠ Backend není dostupný – spusťte server</td></tr>`;
  }
}
 
function fmtDT(dt) {
  if (!dt) return '';
  const d = new Date(dt.replace(' ', 'T'));
  return `<div class="date">${d.toLocaleDateString('cs-CZ')}</div>${d.toLocaleTimeString('cs-CZ')}`;
}
 
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
 
function renderTbl() {
  const tbody = document.getElementById('tbl');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Žádné záznamy</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => `
    <tr>
      <td class="td-name">${esc(r.jmeno)} ${esc(r.prijmeni)}</td>
      <td class="td-org">${esc(r.organizace || '—')}</td>
      <td style="font-family:ui-monospace,monospace;font-size:.82rem">${esc(r.spz || '—')}</td>
      <td class="td-time">${fmtDT(r.prichod_dt)}</td>
      <td class="td-time">${r.odchod_dt ? fmtDT(r.odchod_dt) : '<span style="color:var(--ink3)">—</span>'}</td>
      <td>${r.odchod_dt
        ? '<span class="badge badge-done">Odešel/a</span>'
        : '<span class="badge badge-active">Přítomen/a</span>'}</td>
      <td>
        <button class="btn btn-ghost btn-sm" onclick="openModal(${r.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          ${r.odchod_dt ? 'Detail' : 'Upravit'}
        </button>
      </td>
    </tr>`).join('');
}
 
// ── Zápis příchodu ────────────────────────────────────────────────────────────
async function zapsat() {
  const jmeno    = document.getElementById('fJmeno').value.trim();
  const prijmeni = document.getElementById('fPrijmeni').value.trim();
 
  if (!jmeno || !prijmeni) {
    showAlert('fAlert', 'error', '⚠ Vyplňte jméno i příjmení.');
    if (!jmeno)    document.getElementById('fJmeno').style.borderColor    = 'var(--red)';
    if (!prijmeni) document.getElementById('fPrijmeni').style.borderColor = 'var(--red)';
    return;
  }
  document.getElementById('fJmeno').style.borderColor    = '';
  document.getElementById('fPrijmeni').style.borderColor = '';
 
  const btn = document.getElementById('btnZapis');
  btn.disabled = true;
 
  try {
    const res = await fetch(API + '/navstevnici', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jmeno, prijmeni,
        organizace: document.getElementById('fOrg').value.trim(),
        spz:        document.getElementById('fSpz').value.trim()
      })
    });
 
    let d = {};
    try { d = await res.json(); } catch(e) {}
 
    if (res.ok) {
      const cas = d.prichod_dt ? d.prichod_dt.slice(11, 16) : '';
      showAlert('fAlert', 'success', `✓ ${jmeno} ${prijmeni} zapsán/a${cas ? ' v ' + cas : ''}.`);
      ['fJmeno','fPrijmeni','fOrg','fSpz'].forEach(id => document.getElementById(id).value = '');
      nactiData();
    } else {
      showAlert('fAlert', 'error', '⚠ Chyba ' + res.status + ': ' + (d.error || 'Neznámá chyba.'));
    }
  } catch (e) {
    showAlert('fAlert', 'error', '⚠ Backend není dostupný: ' + e.message);
  }
 
  btn.disabled = false;
}
 
// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(id) {
  const r = data.find(x => x.id === id);
  if (!r) return;
  modalId = id;
  document.getElementById('modalTitle').textContent = r.jmeno + ' ' + r.prijmeni;
  document.getElementById('mJmeno').value  = r.jmeno + ' ' + r.prijmeni;
  document.getElementById('mOrg').value    = r.organizace || '';
  document.getElementById('mSpz').value    = r.spz || '';
  document.getElementById('mOdchodBtn').style.display = r.odchod_dt ? 'none' : '';
  document.getElementById('mAlertDiv').classList.add('hidden');
  document.getElementById('modal').classList.remove('hidden');
}
 
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  modalId = null;
}
 
async function saveModal() {
  try {
    await fetch(API + '/navstevnici/' + modalId, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        organizace: document.getElementById('mOrg').value,
        spz:        document.getElementById('mSpz').value
      })
    });
    closeModal(); nactiData();
  } catch (e) { showModalAlert('error', 'Chyba uložení.'); }
}
 
async function zapisOdchod() {
  try {
    const res = await fetch(API + '/navstevnici/' + modalId, {
      method:  'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ odchod: true })
    });
    if (res.ok) { closeModal(); nactiData(); }
    else { const d = await res.json(); showModalAlert('error', d.error || 'Chyba.'); }
  } catch (e) { showModalAlert('error', 'Chyba.'); }
}
 
// ── Helpers ───────────────────────────────────────────────────────────────────
function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'alert alert-' + type;
  el.textContent = msg;
  el.classList.remove('hidden');
}
function showModalAlert(type, msg) { showAlert('mAlertDiv', type, msg); }
 
// Init
nactiData();
setInterval(nactiData, 20000);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
